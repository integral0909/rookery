name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Start the server with demo data and check it answers
        env:
          ROOKERY_DB: ${{ runner.temp }}/smoke.db
          PORT: 3123
        run: |
          npm run cli -- demo
          npm start &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3123/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3123/ | grep -q '<title>Rookery</title>'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3123/api/me)
          test "$code" = 401
          npm run cli -- backup "$RUNNER_TEMP/backup.db"
